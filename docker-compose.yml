version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_rag
    ports:
      - "6333:6333"  # REST API (matches QDRANT_URL in .env)
      - "6334:6334"  # gRPC API
    volumes:
      - ./qdrant_data:/qdrant/storage  # Persist vector database storage locally
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    restart: unless-stopped

